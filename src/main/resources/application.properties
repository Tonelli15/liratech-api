# --- Banco de dados (PostgreSQL) -------------------------------------------
# A senha vem da variável de ambiente LIRATECH_DB_SENHA; "postgres" é só o padrão.
spring.datasource.url=${LIRATECH_DB_URL:jdbc:postgresql://localhost:5432/liratech}
spring.datasource.username=${LIRATECH_DB_USUARIO:postgres}
spring.datasource.password=${LIRATECH_DB_SENHA:postgres}

# O Hibernate cria e atualiza as tabelas a partir das entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Motor de PLN (microsserviço FastAPI) ------------------------------------
liratech.motor.url=${LIRATECH_MOTOR_URL:http://localhost:8000}
liratech.motor.tempo-limite-ms=5000

# --- Token JWT -----------------------------------------------------------------
# Em produção, defina LIRATECH_JWT_SEGREDO com pelo menos 32 caracteres aleatórios.
liratech.jwt.segredo=${LIRATECH_JWT_SEGREDO:liratech-segredo-de-desenvolvimento-troque-em-producao}
liratech.jwt.validade-horas=8

# --- Frontend autorizado a chamar a API (CORS) ---------------------------------
liratech.frontend.origem=${LIRATECH_FRONTEND_ORIGEM:http://localhost:5173}

server.port=8080
server.error.include-message=always
